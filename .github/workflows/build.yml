name: Build and release APK

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.created == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" && -d "$sdk_root/cmdline-tools" ]]; then
            # Hosted images can use a versioned directory instead of a latest symlink.
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -mindepth 3 -maxdepth 3 \
              -type f -name sdkmanager -print | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "Android sdkmanager not found under $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          echo "Using $sdkmanager_path"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          # A finite input avoids yes reporting a broken pipe when sdkmanager exits.
          license_answers="$(printf 'y\n%.0s' {1..100})"
          "$sdkmanager_path" --sdk_root="$sdk_root" --licenses <<< "$license_answers"
          "$sdkmanager_path" --sdk_root="$sdk_root" --install \
            "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Prepare optional release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]]; then
            if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
              echo 'Configure all four Android signing secrets, or leave all four unset.' >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glyphplayer-release.keystore"
          else
            echo 'No release signing secrets configured. Building a test APK signed with the runner debug key.'
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/glyphplayer-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PreleaseVersionName="$RELEASE_TAG" -PreleaseVersionCode="$RELEASE_NUMBER"

      - name: Publish APK directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$apk" --clobber
          else
            gh release create "$RELEASE_TAG" "$apk" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/glyphplayer-release.keystore"
